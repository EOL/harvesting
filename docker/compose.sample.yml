x-app: &default-app
  image: publishing
  restart: always
  environment: # NOTE: see https://docs.docker.com/compose/environment-variables/ for details.
    - RAILS_ENV=${RAILS_ENV}
    - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
    - REDIS_HOST=${REDIS_HOST}
    - CACHE_URL=${CACHE_URL}
    - TRAITBANK_URL=${TRAITBANK_URL}
    - SCOUT_APM_KEY=${SCOUT_APM_KEY}
    - NODE_OPTIONS=--openssl-legacy-provider npm run start
  depends_on:
    - redis
  deploy:
    replicas: 8
    resources:
      limits:
        cpus: '3.00'
        memory: 4G
    restart_policy:
      condition: on-failure
      delay: 6s
      max_attempts: 3
      window: 120s
  profiles: ["app"]
  logging:
    driver: local
    options:
      max-file: 3
      max-size: 16m

x-worker: &default-worker
  build:
    context: ..
  restart: always
  environment: # NOTE: see https://docs.docker.com/compose/environment-variables/ for details.
    - RAILS_ENV=${RAILS_ENV}
    - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    - EOL_WEB_PRIVATE_URL=${EOL_WEB_PRIVATE_URL}
    - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
    - REDIS_HOST=${REDIS_HOST}
    - CACHE_URL=${CACHE_URL}
    - TRAITBANK_URL=${TRAITBANK_URL}
    - NODE_OPTIONS=--openssl-legacy-provider npm run start
  depends_on:
    - mysql
    - memcached
    - redis
    - elastic01
  deploy:
    resources:
      limits:
        cpus: '1.00'
        memory: 8G
    restart_policy:
      condition: on-failure
      delay: 8s
      max_attempts: 3
      window: 120s
  profiles: ["worker"]
  logging:
    driver: "local"
    options:
      max-file: "3"
      max-size: "5m"


x-log: &default-log
  logging:
    driver: "local"
    options:
      max-file: "5"
      max-size: "100m"

services:
  mysql:
    image: mysql:5.7.12
    container_name: harvesting_mysql
    restart: always
    env_file:
      - resources/docker.env
    volumes:
      - ${EOL_ROOT_DIR}/harvesting_mysql:/var/lib/mysql
    networks:
      - harvesting_network
  redis: # WARNING: It's simpler to just skip persistence, but that means we lose the entire queue on restart.
    <<: *default-log
    deploy:
      restart_policy:
        condition: on-failure
        delay: 8s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.00'
          memory: 4G
    profiles: ["redis"]
    image: redis:6.0
    container_name: redis
    restart: always
    ports:
      - 6379:6379

  app:
    <<: *default-app
    build:
      context: ..
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    volumes:
      - /data/publishing/web:/app/public/data
      - /data/publishing/web_log:/app/log
      - /data/publishing/web_private:/app/data
    ports:
      - "3000"
  pub_sidekiq:
    <<: *default-worker
    container_name: pub_sidekiq
    command: bundle exec sidekiq
    volumes:
      - /data/publishing/web:/app/public/data
      - /data/publishing/sidekiq_log:/app/log
      - /data/publishing/web_private:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 8s
        max_attempts: 3
        window: 120s
  pub_crono:
    <<: *default-worker
    container_name: pub_crono
    command: bundle exec crono
    volumes: # NOTE: YES, it shares the data volumes with app, so it can serve the files that were processed here.
      - /data/publishing/web:/app/public/data
      - /data/publishing/crono_log:/app/log
      - /data/publishing/web_private:/app/data
  pub_worker:
    <<: *default-worker
    container_name: pub_worker
    command: bundle exec rails r "Publishing.work('harvest')"
    volumes: # NOTE: YES, it shares the data volumes with app, so it can serve the files that were processed here.
      - /data/publishing/web:/app/public/data
      - /data/publishing/worker_log:/app/log
      - /data/publishing/web_private:/app/data
      - /data/harvesting/web:/app/harvesting
  pub_data_worker:
    <<: *default-worker
    container_name: pub_data_worker
    command: bundle exec rails r "Publishing.work('download')"
    volumes: # NOTE: YES, it shares the data volumes with app, so it can serve the files that were processed here.
      - /data/publishing/web:/app/public/data
      - /data/publishing/data_log:/app/log
      - /data/publishing/web_private:/app/data
  pub_integrity_worker:
    <<: *default-worker
    container_name: pub_integrity_worker
    command: bundle exec rails r "Publishing.work('data_integrity')"
    volumes: # NOTE: YES, it shares the data volumes with app, so it can serve the files that were processed here.
      - /data/publishing/web:/app/public/data
      - /data/publishing/integrity_log:/app/log
      - /data/publishing/web_private:/app/data
  nginx:
    <<: *default-log
    deploy:
      restart_policy:
        condition: on-failure
        delay: 8s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
    profiles: ["load"]
    build:
      dockerfile: ./nginx.Dockerfile
      context: ..
    container_name: nginx
    volumes:
      - ../config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /data/publishing/nginx_log:/var/log/nginx
      - /data/publishing/web:/app/public/data:ro
      - /data/publishing/web_assets/assets:/app/public/assets:ro
      - /data/publishing/web_packs/packs:/app/public/packs:ro
    ports:
      - "8080:80"
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    depends_on:
      - app
  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"
    restart: unless-stopped
networks:
  elastic:
    driver: bridge
